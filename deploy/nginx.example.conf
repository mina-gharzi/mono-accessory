# Example Nginx site for the Docker Compose deployment.
#
#   /etc/nginx/sites-available/mono-accessory
#
# Replace shop.example.com and the certificate paths, then enable the site and
# run `nginx -t && systemctl reload nginx`. The app listens only on
# 127.0.0.1:3000, so Nginx is the only public entry point.
#
# docker-compose.yml sets TRUST_PROXY=true for the app because this config
# OVERWRITES X-Forwarded-For with the address Nginx sees. Do not switch to
# $proxy_add_x_forwarded_for: the app trusts the first entry, and appending
# would let a client spoof its address for the login rate limiter.

server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com;

    # Let `certbot certonly --webroot` renew certificates without stopping Nginx.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # `listen ... http2` is deprecated since nginx 1.25.1; enable HTTP/2 with
    # this directive instead.
    http2 on;
    server_name shop.example.com;

    # Use the paths printed by certbot, or the files from your certificate
    # provider. Keep the key readable by root only.
    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Admin uploads are limited to 5 MB in the app; allow multipart overhead.
    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/rss+xml image/svg+xml;

    # Next.js fingerprints these files; cache them for a year. The header is
    # replaced instead of appended so only one Cache-Control value is sent.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # Keep streamed (PPR) responses unbuffered.
        proxy_buffering off;
    }
}
